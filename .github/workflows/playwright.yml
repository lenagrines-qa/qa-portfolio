# GitHub Actions: runs the whole Playwright suite on GitHub's servers
# on every push and pull request, and keeps the Test Summary Report as a downloadable artifact.
# On the main branch it also publishes the site and the latest report to GitHub Pages:
#   site   → https://<user>.github.io/<repo>/
#   report → https://<user>.github.io/<repo>/report/
# The site under test is in the `site/` folder of this repo.

name: Playwright tests

on:
  push:
  pull_request:
  # Adds a "Run workflow" button in the Actions tab for manual runs.
  workflow_dispatch:

# Least privilege: the test job only reads the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Safety net: stop the job if something hangs.
    timeout-minutes: 15

    steps:
      # 1. This repository: the site and the tests.
      - name: Check out repository
        uses: actions/checkout@v7

      # 2. Node.js 22 with npm download cache (faster repeat runs).
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 3. Exact dependency versions from package-lock.json.
      - name: Install dependencies
        run: npm ci

      # 4. Chromium, Firefox, and WebKit plus the Linux system libraries they need.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # 5. Run the tests. GitHub sets CI=true, so playwright.config.ts switches
      #    to CI mode: 2 retries, 1 worker, a fresh web server, no test.only.
      - name: Run Playwright tests
        run: npx playwright test

      # 6. Test Summary Report — kept even when tests fail (that is when it is needed most).
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: test-report/
          retention-days: 14

      # 7. Screenshots, videos, and traces of failed tests.
      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      # 8. Main branch only: the site at the root, the report under /report/.
      #    Published even when tests fail, so the public report is always honest.
      - name: Prepare GitHub Pages content
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R test-report _site/report

      - name: Upload GitHub Pages content
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # 9. Publish the prepared content to GitHub Pages.
  deploy:
    needs: test
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Only this job may publish to Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
